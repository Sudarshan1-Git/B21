name: B21-workflow

on: push

jobs: 
    first-job:
      runs-on: ubuntu-latest
      steps: 
        - name: create a file
          run: echo "this is test report" > report.txt

    second-job: 
      needs: first-job
      runs-on: ubuntu-latest
      steps:
        - name: viewing the reports from first job
          run: cat report.txt      
